alarms:
  - alarm_id: 1
    answerable: true
    # Code 370 falls in the 364-395 "Boost Capacitor Overvoltage Fault" range (manual p.103).
    gold_causes:
      - "Boost capacitor overvoltage fault — the manual names the fault but does not explain the underlying electrical root cause beyond this; treat as the limit of what the source document supports."
    gold_mandatory_pages:
      - 103
    gold_step_checklist:
      - "Disconnect the AC and DC switches (and battery-side switches if batteries are present)"
      - "Wait, then close the AC and DC switches in turn 15 minutes later and restart the system"
      - "If the fault persists, contact Sungrow Power Customer Service"
    notes: "Page 103's entry is self-contained; the general p.105 maintenance DANGER block was deliberately not added as mandatory since the fault-specific procedure already covers isolation."

  - alarm_id: 2
    answerable: true
    # Code 1610 falls in the "1600-1615, 1632-1655" PV Grounding Fault range (manual p.103).
    gold_causes:
      - "PV grounding fault (earth fault on the PV/DC side)"
    gold_mandatory_pages:
      - 103
    gold_step_checklist:
      - "Do NOT directly disconnect the DC switch or unplug PV terminals while DC current is above 0.5 A — this is an explicit prohibition, not just a precaution"
      - "Wait until DC current falls below 0.5 A, then disconnect the DC switch and unplug the faulty string(s)"
      - "Do not reinsert the faulty strings before the grounding fault is cleared"
      - "Contact Sungrow Customer Service if the fault persists and isn't explained by the above"
    notes: "The clearest case of a hard mandatory safety sequence in the manual (explicit 'forbidden' language) — a strong candidate for spot-checking the selector's behavior on."

