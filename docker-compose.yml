services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///./data/processed/suryasutra.db
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      # Embedding model cache (D-20) — without this, every `docker compose up` after a
      # `down` re-downloads ~130MB from Hugging Face Hub and redoes the (slow, CPU-
      # bound) first-load encode step instead of reusing what's already on disk.
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  huggingface-cache:
