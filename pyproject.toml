[project]
name = "suryasutra"
version = "0.1.0"
description = "AI copilot for O&M alarm triage at Indian solar plants, under a strict LLM token budget."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "groq>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party libraries with no type stubs / py.typed marker available.
module = ["rank_bm25", "pymupdf", "fitz", "faiss"]
ignore_missing_imports = true
